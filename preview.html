<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>やったこと · 表示プレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#342f31;background:#f3efeb;font:15px/1.55 system-ui,"Yu Gothic UI",sans-serif}main{max-width:1160px;margin:auto;padding:clamp(20px,4vw,54px)}
h1{font-size:clamp(24px,3vw,36px);font-weight:550;letter-spacing:-.03em;margin:0}header p{margin:4px 0 28px;color:#645b5e}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:28px}section{min-width:0}header a{color:#74465b}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:10px}h2{font-size:17px;font-weight:600;margin:0}
nav{display:flex;gap:4px}nav button{padding:6px 12px;border:1px solid #c7bec1;border-radius:99px;background:transparent;color:#423b3d;font:inherit;cursor:pointer;font-size:13px}
nav button[aria-pressed=true]{color:white;background:#654154;border-color:#654154}
.stage{position:relative;height:650px;overflow:hidden;border:1px solid #cfc6c1;border-radius:16px;isolation:isolate;background:linear-gradient(150deg,#d5e5e0 0%,#bcccc7 46%,#9bada6 100%)}
.stage:before,.stage:after{content:"";position:absolute;pointer-events:none;width:125%;height:43%;background:#7d9996;bottom:-16%;left:-15%;border-radius:46% 70% 0 0;transform:rotate(-15deg)}
.stage:after{background:#577978;bottom:-28%;transform:rotate(11deg);left:-2%}
iframe,.bubble{z-index:1;position:absolute;border:0;background:#faf8f6}
iframe{inset:0;width:100%;height:100%}.stage[data-state=mini] iframe{inset:auto 14px 14px auto;width:min(360px,calc(100% - 28px));height:510px;border-radius:12px;box-shadow:0 9px 32px #29332d33}
#android .stage[data-state=mini] iframe{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:calc(100% - 32px);height:520px}
.bubble{right:32px;bottom:48px;width:52px;height:52px;border-radius:50%;padding:0;overflow:hidden;cursor:pointer;box-shadow:0 3px 10px #27342b33}.bubble img{width:100%;height:100%;display:block}
[hidden]{display:none!important}.note{color:#665e60;font-size:13px;margin:8px 0}
@media(max-width:780px){main{max-width:520px}.grid{grid-template-columns:1fr}.stage{height:610px}}
</style></head><body><main><header><h1>表示プレビュー</h1><p>右下のアイコンで切り替えられます。ここでの入力はカレンダーに保存されません。</p></header>
<div class="grid"><section id="windows"><div class="top"><h2>Windows</h2><nav aria-label="Windowsの表示"><button data-mode="full">通常</button><button data-mode="mini">小窓</button></nav></div><div class="stage"><iframe sandbox="allow-scripts" title="Windowsの記録フォーム"></iframe></div><p class="note">小窓の背景は、元のウィンドウを手動で最小化した状態です。</p></section>
<section id="android"><div class="top"><h2>Android</h2><nav aria-label="Androidの表示"><button data-mode="full">通常</button><button data-mode="bubble">丸のみ</button><button data-mode="mini">小窓</button></nav></div><div class="stage"><iframe sandbox="allow-scripts" title="Androidの記録フォーム"></iframe><button class="bubble" aria-label="記録窓を開く" hidden><img src="./icon-192.png" alt=""></button></div></section></div></main>
<script>
(async () => {
  const response = await fetch('./android/assets/index.html');
  if (!response.ok) throw new Error('form');
  const original = await response.text();
  for (const section of document.querySelectorAll('section')) {
    const android = section.id === 'android';
    const stage = section.querySelector('.stage'), frame = stage.querySelector('iframe'), bubble = stage.querySelector('.bubble');
    let mode = android ? 'mini' : 'full';
    function show(next) {
      mode=next; stage.dataset.state=mode;
      frame.hidden = mode==='bubble'||mode==='off';
      if(bubble) bubble.hidden=mode!=='bubble';
      for(const button of section.querySelectorAll('nav button')) button.setAttribute('aria-pressed',String(button.dataset.mode===mode));
      frame.contentWindow.postMessage({mode},'*');
    }
    for(const button of section.querySelectorAll('nav button')) button.onclick=()=>show(button.dataset.mode);
    if(bubble) bubble.onclick=()=>show('mini');
    window.addEventListener('message',event=>{
      if(event.source!==frame.contentWindow) return;
      if(event.data==='ready') show(mode);
      if(event.data==='toggle') show(android?'bubble':mode==='mini'?'full':'mini');
      if(event.data==='fold') show('bubble');
      if(event.data==='stop') show('off');
    });
    const bridge = `<script>
      const send = action => parent.postMessage(action,'*');
      window.AndroidLog = {
        floatButton:()=>send('toggle'), fold:()=>send('fold'), stopFloating:()=>send('stop'),
        save:()=>{onCalendarResult(true,'プレビュー');if(${android} && document.documentElement.classList.contains('compact')) send('fold');}
      };
      addEventListener('message',e=>{
        if(e.source!==parent || !e.data.mode) return;
        const compact=e.data.mode==='mini';
        setFloating(compact);
        if(!${android}){
          floatButton.hidden=false;
          document.querySelector('.mini-actions').hidden=true;
          floatButton.title=compact?'通常のウィンドウに戻る':'小窓で記録';
          floatButton.setAttribute('aria-label',floatButton.title);
        }
      });
      send('ready');
    <\/script>`;
    frame.srcdoc=original.replace('</body>',bridge+'</body>');
  }
})().catch(()=>document.querySelector('header p').textContent='プレビューを読み込めませんでした。ページを再読み込みしてください。');
</script></body></html>
